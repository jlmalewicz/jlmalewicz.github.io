
<!DOCTYPE html>

<html>
<head>
    <title> bug </title>
</head>




<body>
    <button style="background-color: white; border: none; box-shadow: none;" onclick="bugMultiplier()"> <div id="BugDiv"> <img src="img/uhoh.png"></div> </button>
    uh oh youve been bugged!
</body>

<script>
function bugMultiplier() {

const div = document.getElementById("BugDiv");
const bug = document.createElement("img");
bug.src = "img/uhoh.png"
div.append(bug);
}
</script>

</body>
